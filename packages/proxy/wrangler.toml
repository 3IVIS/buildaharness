name = "buildaharness-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Uncomment and set your Worker route after deploying:
# [[routes]]
# pattern = "proxy.yourdomain.com/*"
# zone_name = "yourdomain.com"

[vars]
ALLOWED_ORIGIN = "https://buildaharness.com"
PORT = "3001"

# /web/* quota tuning (all optional — see src/rate-limit.ts's DEFAULTS for fallbacks if unset)
# WEB_REQUESTS_PER_HOUR = "120"
# WEB_BYTES_PER_HOUR = "2000000"
# WEB_MAX_CONCURRENT_FETCHES = "4"
# WEB_HOST_REQUESTS_PER_HOUR = "60"
# WEB_PER_IP_REQUESTS_PER_HOUR = "30"
# WEB_BRAVE_DAILY_CEILING = "2000"
# WEB_GRANT_REQUESTS_PER_HOUR = "20"
# WEB_GUARD_REJECT_ALERT_THRESHOLD = "5"

# Secrets — set via: wrangler secret put <NAME>
# ANTHROPIC_API_KEY
# OPENAI_API_KEY
# PROXY_SECRET
# BRAVE_API_KEY (fallback only — the browser client normally sends its own key per request)

# Local dev with miniflare (wrangler dev uses miniflare under the hood).
# Override vars for local dev by creating a .dev.vars file (gitignored):
#   ANTHROPIC_API_KEY=sk-ant-...
#   OPENAI_API_KEY=sk-...
#   PROXY_SECRET=local-secret
#   ALLOWED_ORIGIN=http://localhost:5173
#   BRAVE_API_KEY=...

[dev]
port = 3001
local_protocol = "http"
