name: Deploy Aielia Email to email.myaielia.com

# Builds the Aielia Email page (packages/chat-ui, vite.email.config.ts, base '/') and publishes it to the root of the
# 3IVIS/myaielia-email repo, which GitHub Pages serves at https://email.myaielia.com (its own subdomain: a Pages repo serves
# one custom domain). MANUAL ONLY (workflow_dispatch): merging code never publishes the page by itself. Run it from the Actions
# tab when the page is ready to be public. The mail itself never touches this build: the page talks to the mail provider from
# the visitor's browser; nothing about a mailbox is baked in.
#
# Needs secrets.MYAIELIA_EMAIL_DEPLOY_KEY, a write-enabled deploy key on 3IVIS/myaielia-email.

on:
  workflow_dispatch:

concurrency:
  group: deploy-email
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout buildaharness
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Build workspace deps
        run: |
          npm run build --workspace=packages/harness
          npm run build --workspace=packages/runtime
          npm run build --workspace=packages/aielia

      - name: Build the Email page
        env:
          CHAT_UI_BASE: /
        run: npm run build:email --workspace=packages/chat-ui

      - name: Check deploy key is present
        run: |
          if [ -z "${{ secrets.MYAIELIA_EMAIL_DEPLOY_KEY }}" ]; then
            echo "❌  secrets.MYAIELIA_EMAIL_DEPLOY_KEY is not set — cannot push to 3IVIS/myaielia-email."
            exit 1
          fi

      - name: Checkout myaielia-email
        uses: actions/checkout@v4
        with:
          repository: 3IVIS/myaielia-email
          ssh-key: ${{ secrets.MYAIELIA_EMAIL_DEPLOY_KEY }}
          path: pages

      - name: Sync build into the repo root (keeping CNAME, .nojekyll and the README)
        run: |
          test -f packages/chat-ui/dist-email/index.html
          find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name CNAME ! -name .nojekyll ! -name README.md -exec rm -rf {} +
          cp -R packages/chat-ui/dist-email/. pages/
          test "$(cat pages/CNAME)" = "email.myaielia.com"

      - name: Commit and push if changed
        working-directory: pages
        run: |
          git config user.name  "buildaharness-ci"
          git config user.email "ci@buildaharness.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to the Email page — nothing to deploy."
            exit 0
          fi
          git commit -m "deploy: Aielia Email build from ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed (attempt $attempt) — rebasing onto origin and retrying"
            git pull --rebase origin main
          done
          echo "❌  Could not push after 3 attempts"
          exit 1
