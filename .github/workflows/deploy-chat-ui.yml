name: Deploy chat-ui to /try

# Builds the browser build of the Aielia assistant (packages/chat-ui) and publishes
# it to the buildaharness-pages repo under /try/, which GitHub Pages serves at
# https://buildaharness.com/try. Bring-your-own-key for the LLM itself — the page keeps
# that API key in the visitor's browser (localStorage), nothing is proxied server-side
# for it. Web search/fetch are the exception (see the Build chat-ui step below): they
# default to routing through @buildaharness/proxy's SSRF-guarded /web/* endpoints, since
# a plain browser tab can't call Brave or an arbitrary URL directly (CORS) — the visitor
# still supplies their own Brave key, sent fresh per request, never stored on the proxy.
#
# Needs secrets.PAGES_DEPLOY_KEY: the private half of an SSH deploy key with write
# access on 3IVIS/buildaharness-pages (Settings → Deploy keys, "Allow write access").
# Without it the deploy step fails fast with a clear message.

on:
  push:
    branches: [main]
    paths:
      - 'packages/chat-ui/**'
      - 'packages/personal-assistant/**'
      - 'packages/runtime/**'
      - 'packages/harness/**'
      - '.github/workflows/deploy-chat-ui.yml'
  workflow_dispatch:

concurrency:
  group: deploy-chat-ui
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout buildaharness
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      # chat-ui imports @buildaharness/personal-assistant + runtime by workspace link;
      # build their dist first (personal-assistant's build also pulls harness).
      - name: Build workspace deps
        run: |
          npm run build --workspace=packages/harness
          npm run build --workspace=packages/runtime
          npm run build --workspace=packages/personal-assistant

      - name: Build chat-ui
        env:
          CHAT_UI_BASE: /try/
          # W8 of plans/browser_web_tools_via_proxy_plan.html: gives this build only a working
          # default web_search/fetch_url path via the deployed proxy Worker — DEFAULT_CONFIG
          # itself (every other build: dev, self-hosted, desktop) is untouched. These are
          # defaults, not hard pins (browser-config.ts's envOverridesFromImportMetaEnv sets
          # them as ordinary overrides, same precedence tier as VITE_ASSISTANT_PROXY_URL): a
          # visitor can still turn web off or switch back to 'direct' in Settings. No Brave key
          # is baked in here — each visitor supplies their own (see the proxy's braveApiKey
          # request field), so search stays off in practice until they do.
          VITE_ASSISTANT_PROXY_URL: https://buildaharness-proxy.buildaharness.workers.dev
          VITE_ASSISTANT_ENABLE_WEB: 'true'
          VITE_ASSISTANT_WEB_BACKEND: proxy
        run: npm run build --workspace=packages/chat-ui

      - name: Check deploy key is present
        run: |
          if [ -z "${{ secrets.PAGES_DEPLOY_KEY }}" ]; then
            echo "❌  secrets.PAGES_DEPLOY_KEY is not set — cannot push to 3IVIS/buildaharness-pages."
            echo "    Add the private half of a write-enabled SSH deploy key for that repo as this secret."
            exit 1
          fi

      - name: Checkout buildaharness-pages
        uses: actions/checkout@v4
        with:
          repository: 3IVIS/buildaharness-pages
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages

      - name: Sync build into pages/try
        run: |
          rm -rf pages/try
          mkdir -p pages/try
          cp -R packages/chat-ui/dist/. pages/try/

      - name: Commit and push if changed
        working-directory: pages
        run: |
          git config user.name  "buildaharness-ci"
          git config user.email "ci@buildaharness.com"
          git add try
          if git diff --cached --quiet; then
            echo "No changes to /try — nothing to deploy."
            exit 0
          fi
          git commit -m "deploy: chat-ui /try build from ${GITHUB_SHA::7}"
          git push
